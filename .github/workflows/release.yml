name: Release

on:
  push:
    tags:
      - '*'
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install -y lua5.4
      - run: lua5.4 tests/run_tests.lua

  release:
    needs: test
    runs-on: ubuntu-latest
    # Lets the packager create/update the matching GitHub Release (zip
    # asset + notes) using the workflow's own token - without this the
    # default GITHUB_TOKEN is read-only and that step fails.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      # CHANGELOG.md keeps full project history for humans browsing the
      # repo, but the packager's manual-changelog dumps that whole file
      # into the GitHub Release body verbatim - extract just this
      # release's own section (from the first "## " heading to the next)
      # so each release only shows its own notes.
      - run: awk '/^## /{n++} n==1' CHANGELOG.md > CHANGELOG-release.md
      - uses: BigWigsMods/packager@v2
        env:
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
          WAGO_API_TOKEN: ${{ secrets.WAGO_API_TOKEN }}
          GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
